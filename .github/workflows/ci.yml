name: CI

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; a newer push to main replaces a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Check types and content schemas
        run: bun run check
      - name: Build
        run: bun run build

      # Pushes to main deploy the built site to the Cloudflare Worker that serves macklinw.com:
      # static assets from dist, plus a small script for byte ranges on /media/* (wrangler.jsonc).
      # Wrangler runs on Node.
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bunx wrangler deploy --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
